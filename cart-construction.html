<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | Himalora Natural</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-brown: #2c1a0e; --brown-light: #3b2313; --brown-card: #452a18; --accent-gold: #b8955c; --text-muted: #aaaaaa; --text-white: #ffffff; --font-heading: 'Cormorant Garamond', serif; --font-body: 'Jost', sans-serif; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); color: var(--text-white); background-color: var(--primary-brown); line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 25px 5%; background-color: var(--primary-brown); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { font-family: var(--font-heading); font-size: 2.5rem; letter-spacing: 3px; text-align: center; color: var(--text-white); margin: 0 auto;}
        .logo span { font-size: 0.7rem; display: block; font-family: var(--font-body); letter-spacing: 5px; color: var(--accent-gold); }
        .back-to-shop-container { max-width: 1200px; margin: 30px auto 0; padding: 0 5%; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 500; color: var(--text-muted); transition: all 0.3s ease; }
        .back-btn:hover { color: var(--accent-gold); transform: translateX(-5px); }
        .cart-container { max-width: 1200px; margin: 20px auto 80px; padding: 0 5%; display: flex; gap: 50px; }
        .cart-items-section { flex: 1.5; }
        .cart-header { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 20px; font-size: 0.9rem; text-transform: uppercase; color: var(--text-muted); }
        .cart-item { display: flex; align-items: center; gap: 20px; background: var(--brown-light); padding: 20px; border-radius: 8px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .cart-item img { width: 100px; height: 100px; object-fit: cover; border-radius: 5px; background: #fff; }
        .cart-item-details { flex: 1; }
        .cart-item-details h3 { font-family: var(--font-heading); font-size: 1.4rem; font-weight: 400; margin-bottom: 5px; }
        .cart-item-details p { color: var(--accent-gold); font-size: 1.1rem; }
        .cart-qty { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .qty-btn { background: rgba(255,255,255,0.1); border: none; color: white; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; }
        .qty-btn:hover { background: var(--accent-gold); color: var(--primary-brown); }
        .qty-val { font-size: 1rem; font-weight: 600; min-width: 40px; text-align: center; border: none; background: transparent; color: var(--text-white); outline: none; -moz-appearance: textfield; }
        .qty-val::-webkit-outer-spin-button, .qty-val::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .remove-item { color: #d93838; cursor: pointer; font-size: 1.2rem; transition: 0.3s; background: none; border: none; padding: 10px; }
        .remove-item:hover { color: #ff0000; transform: scale(1.1); }
        .cart-summary { flex: 1; background: var(--brown-card); padding: 30px; border-radius: 8px; height: fit-content; border: 1px solid rgba(255,255,255,0.05); }
        .cart-summary h2 { font-family: var(--font-heading); font-size: 1.8rem; font-weight: 400; margin-bottom: 25px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 1rem; color: var(--text-muted); }
        .summary-row.total { border-top: 1px solid rgba(255,255,255,0.2); padding-top: 15px; margin-top: 15px; font-size: 1.3rem; font-weight: 600; color: var(--text-white); }
        .summary-row.total span:last-child { color: var(--accent-gold); }
        .btn-checkout { display: block; width: 100%; padding: 18px; background: var(--accent-gold); color: var(--primary-brown); border: none; text-transform: uppercase; font-weight: 600; font-size: 1rem; letter-spacing: 2px; cursor: pointer; transition: 0.3s; border-radius: 4px; margin-top: 20px; text-align: center; }
        .btn-checkout:hover { background: var(--text-white); }
        .empty-cart { text-align: center; padding: 50px 0; color: var(--text-muted); font-style: italic; }
        @media (max-width: 900px) { .cart-container { flex-direction: column; } .cart-item { flex-direction: column; text-align: center; } .cart-qty { justify-content: center; } }
    </style>
</head>
<body>
    <header><div class="logo">HIMALORA<span>NATURAL</span></div></header>
    <div class="back-to-shop-container"><a href="product-construction.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> BACK</a></div>
    <div class="cart-container">
        <div class="cart-items-section">
            <div class="cart-header"><span>Product</span><span>Total</span></div>
            <div id="cartList"></div>
        </div>
        <div class="cart-summary">
            <h2>Order Summary</h2>
            <div class="summary-row"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
            <div class="summary-row"><span>Shipping</span><span>$23.19</span></div>
            <div class="summary-row total"><span>Total</span><span id="grandTotal">$0.00</span></div>
            <a href="checkout.html" class="btn-checkout" onclick="saveCartForCheckout()">PROCEED TO CHECKOUT</a>
        </div>
    </div>
    <script>
        const SHIPPING_FEE = 23.19;
        let cart = JSON.parse(localStorage.getItem('himalora_cart')) || [];
        function renderCart() {
            const cartList = document.getElementById('cartList');
            const subtotalEl = document.getElementById('subtotal');
            const totalEl = document.getElementById('grandTotal');
            cartList.innerHTML = ''; let total = 0;
            if (cart.length === 0) { cartList.innerHTML = '<div class="empty-cart">Your cart is currently empty.</div>'; subtotalEl.innerText = '$0.00'; totalEl.innerText = '$' + SHIPPING_FEE.toFixed(2); return; }
            cart.forEach((item, index) => {
                total += item.price * item.qty;
                const div = document.createElement('div'); div.className = 'cart-item';
                div.innerHTML = `<img src="${item.image}" alt="${item.name}"><div class="cart-item-details"><h3>${item.name}</h3><p>$${item.price.toFixed(2)}</p><div class="cart-qty"><button class="qty-btn" onclick="changeQty(${index}, -1)"><i class="fa-solid fa-minus"></i></button><input type="number" class="qty-val" value="${item.qty}" min="1" onchange="setQty(${index}, this.value)"><button class="qty-btn" onclick="changeQty(${index}, 1)"><i class="fa-solid fa-plus"></i></button></div></div><button class="remove-item" onclick="removeItem(${index})"><i class="fa-solid fa-trash"></i></button>`;
                cartList.appendChild(div);
            });
            subtotalEl.innerText = '$' + total.toFixed(2); totalEl.innerText = '$' + (total + SHIPPING_FEE).toFixed(2);
        }
        function changeQty(index, change) { if (cart[index].qty + change >= 1) { cart[index].qty += change; save(); renderCart(); } }
        function setQty(index, value) { cart[index].qty = Math.max(1, parseInt(value) || 1); save(); renderCart(); }
        function removeItem(index) { cart.splice(index, 1); save(); renderCart(); }
        function save() { localStorage.setItem('himalora_cart', JSON.stringify(cart)); }
        function saveCartForCheckout() { localStorage.setItem('himalora_cart', JSON.stringify(cart)); }
        document.addEventListener("DOMContentLoaded", renderCart);
    </script>
</body>
</html>
